# Appelle la base Supabase tous les 3 jours pour éviter sa mise en veille (offre gratuite).
# Se lance aussi à la main : onglet Actions > « Garder Supabase éveillé » > Run workflow.
name: Garder Supabase éveillé
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de la fonction ping
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://vnsdvtedgkshwbgluepo.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_7PTYWyiVurzHfrZ_e3Knlw_pEonXfjx" \
            -H "Content-Type: application/json" -d '{}')
          echo "Réponse : $code"
          test "$code" = "200"
