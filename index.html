<style>
/* VOICE: sober, procedural, a little ominous — a federal case file, not a fan site.
   IDEA: a dossier in an olive filing cabinet: folder tabs, typed sheets, rubber stamps, redaction bars.
   PICTURE: the working sheet itself (agent file, timeline of operations, evidence board) under a modest title.
   COLOUR and TYPE: olive drab field, off-white paper, one stamp red; Special Elite for typed titles and stamps, Archivo body, Courier Prime for filled-in values.
   LAYOUT: header band, folder tabs, one paper sheet up to 1240px; columns collapse below 760px. */
:root{color-scheme:light dark;
--field:light-dark(#3a4733,#11160f);--field-ink:#ecebdf;
--paper:light-dark(#f5f2ea,#1f251c);--paper2:light-dark(#ebe6d8,#283023);
--ink:light-dark(#1c2118,#e7e4d8);--muted:light-dark(#5c6455,#a6ad98);
--line:light-dark(#d2cbb7,#3b4436);--stamp:light-dark(#b3261e,#ff7468);
--ok:light-dark(#4b6a2a,#a8c873);--tab:light-dark(#d9d1ba,#2b3327)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--field);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3,.typed{font-family:"Special Elite","Courier New",monospace;font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4vw,44px)}h2{font-size:26px}h3{font-size:19px}
.val,input,textarea,select{font-family:"Courier Prime","Courier New",monospace}
button,.btn{font:600 15px Archivo,sans-serif;min-height:44px;padding:0 16px;border-radius:4px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
button.primary{background:var(--ink);color:var(--paper)}
button.small{min-height:36px;padding:0 10px;font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
input,textarea,select{font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%}
input:disabled,textarea:disabled,select:disabled{background:transparent;border-color:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(4vw,16px);color:#ecebdf}
.top .brand{font-family:"Special Elite",monospace;font-size:22px;color:#ecebdf;margin-inline-end:auto}
.top .brand small{display:block;font:13px Archivo,sans-serif;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#ecebdf}
.av{width:32px;height:32px;border-radius:50%;background:#5865f2;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.top select{width:auto;background:#2a3425;color:#ecebdf;border-color:#58664f;font-family:Archivo,sans-serif}
.top button{border-color:#8f9b84;color:#ecebdf}
/* tabs */
.tabs{display:flex;gap:4px;padding:0 max(4vw,16px);overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;font-family:"Special Elite",monospace;font-size:17px;color:var(--ink);text-decoration:none;background:var(--tab);padding:10px 18px 8px;border-radius:8px 8px 0 0;min-height:44px;display:flex;align-items:center;opacity:.85}
.tabs a[aria-current]{background:var(--paper);opacity:1}
.tabs a.mj{background:light-dark(#c9b9b2,#3a2c29)}
.tabs a.mj[aria-current]{background:var(--paper)}
.sheet{background:var(--paper);max-width:1240px;margin:0 max(4vw,16px) 0;padding:clamp(20px,3.5vw,44px);min-height:70vh;box-shadow:0 18px 40px rgba(0,0,0,.25)}
@media(min-width:1330px){.sheet{margin-inline:auto}.tabs{max-width:1240px;margin:0 auto;padding:0}.top{max-width:1240px;margin:0 auto;padding-inline:0}}
.foot{color:#c8ccbd;font-size:13px;text-align:center;padding:18px 16px 30px}
/* generic */
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.side{grid-template-columns:minmax(0,260px) minmax(0,1fr)}
@media(max-width:760px){.g2,.g3,.side{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:4px;padding:18px;background:var(--paper)}
.box.tint{background:var(--paper2);border-color:transparent}
.hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.muted{color:var(--muted)}.sm{font-size:14px}
.stamp{display:inline-block;font-family:"Special Elite",monospace;color:var(--stamp);border:2.5px solid currentColor;padding:2px 10px 0;transform:rotate(-3deg);font-size:15px;border-radius:3px;white-space:nowrap}
.stamp.ok{color:var(--ok)}.stamp.dim{color:var(--muted)}
.redact{display:inline-block;background:var(--ink);color:var(--paper);font-family:"Special Elite",monospace;font-size:12px;padding:2px 10px;min-width:90px;text-align:center;letter-spacing:.02em}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px dashed var(--line)}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;border-radius:0;padding:10px 6px;min-height:52px;font-weight:400;justify-content:flex-start}
.pick[aria-current]{background:var(--paper2)}
.pick b{font-weight:700;display:block}
.meter{height:10px;background:var(--paper2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.bad i{background:var(--stamp)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* agent sheet */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media(max-width:520px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{border:1.5px solid var(--ink);border-radius:3px;padding:6px;text-align:center}
.stat label{font-weight:700;color:var(--ink);margin:0}
.stat input{text-align:center;font-size:22px;padding:2px}
.stat .x5{font-size:13px;color:var(--muted)}
.derived{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:520px){.derived{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pair{display:flex;align-items:center;gap:4px}.pair input{text-align:center}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
@media(max-width:520px){.skills{grid-template-columns:minmax(0,1fr)}}
.sk{display:grid;grid-template-columns:minmax(0,1fr) 74px 30px;gap:6px;align-items:center;border-bottom:1px dashed var(--line);padding:2px 0}
.sk.ro{grid-template-columns:minmax(0,1fr) 74px}
.sk input{padding:5px 6px}.sk input[type=number]{text-align:right}
.x{min-height:30px;width:30px;padding:0;justify-content:center;border-color:var(--line);color:var(--muted)}
.weap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;align-items:center;margin-bottom:6px}
.weap.ro{grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}
@media(max-width:600px){.weap,.weap.ro{grid-template-columns:repeat(2,minmax(0,1fr))}.weap .x{grid-column:span 2;width:auto}}
.checks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.checks input{width:22px;height:22px;accent-color:var(--stamp)}
.sec{margin-top:26px}.sec>h3{border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
/* timeline */
.tl{position:relative;padding-inline-start:26px}
.tl:before{content:"";position:absolute;inset:6px auto 6px 7px;width:2px;background:var(--line)}
.op{position:relative;margin-bottom:12px}
.op:before{content:"";position:absolute;left:-24px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.op.cur:before{background:var(--stamp);border-color:var(--stamp)}
.op button{width:100%;text-align:start;display:block;padding:14px;min-height:0;border-color:var(--line);font-weight:400}
.op button[aria-current]{border-color:var(--ink);background:var(--paper2)}
.op.locked button{border-style:dashed}
.cr{border-inline-start:3px solid var(--ink);padding:4px 0 4px 16px;margin:18px 0}
.cr p{margin:.4em 0}
/* evidence */
.ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.card{border:0;padding:0;background:none;text-align:start;display:block;min-height:0;font-weight:400;position:relative}
.card .ph{background:var(--paper2);padding:12px;transform:rotate(var(--r,0deg));box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .2s}
.card:hover .ph{transform:rotate(0)}
@media(prefers-reduced-motion:reduce){.card .ph{transition:none}}
.card svg{display:block;width:100%;height:auto}
.card .cap{margin-top:10px;font-size:14px}
.card.lock .ph{opacity:.45}
.lb{position:fixed;inset:0;background:rgba(10,14,9,.88);display:grid;grid-template-rows:auto minmax(0,1fr) auto;z-index:20;padding:16px}
.lb .bar{display:flex;justify-content:space-between;gap:10px;color:#ecebdf;align-items:center}
.lb button{border-color:#8f9b84;color:#ecebdf}
.lb .img{display:grid;place-items:center;padding:12px 0}
.lb svg{max-height:72vh;max-width:min(92vw,720px);width:100%;height:auto;background:#f5f2ea}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{max-width:560px;width:100%;padding:clamp(22px,5vw,44px);box-shadow:0 18px 40px rgba(0,0,0,.3)}
.discord{background:#5865f2;border-color:#5865f2;color:#fff;width:100%;justify-content:center;font-size:16px;min-height:50px}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:460px){.who{grid-template-columns:minmax(0,1fr)}}
.who button{justify-content:flex-start;font-weight:400;border-color:var(--line);text-align:start}
.idcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start;margin-bottom:18px}
@media(max-width:520px){.idcard{grid-template-columns:minmax(0,1fr)}}
.portrait{width:150px;aspect-ratio:4/5;background:#fff;padding:7px 7px 7px;box-shadow:0 8px 18px rgba(0,0,0,.22);transform:rotate(-1.5deg);position:relative}
.portrait img,.portrait svg{display:block;width:100%;height:100%;object-fit:cover}
.portrait:before{content:"";position:absolute;top:-10px;left:22px;width:14px;height:34px;border:3px solid #8b8f86;border-radius:8px;z-index:1}
.pbtns{display:flex;flex-direction:column;gap:6px;margin-top:14px;width:150px}
.pbtns .btn,.pbtns button{margin:0;color:var(--ink);font-size:14px;min-height:36px;justify-content:center;padding:0 8px;white-space:nowrap}
.pt{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;display:block;background:#7d8274}
.pt svg{width:100%;height:100%;border-radius:50%}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%}th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n{text-align:right;white-space:nowrap}td input{padding:5px 6px}
pre,.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted);font-size:13px}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<script>
{
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='portail-maquette-v1';

function mk(id,group,name,prof,player,st,over,motiv,liens,armes,equip,bless){
  const [FOR,CON,DEX,INT,POU,CHA]=st;
  const comps=BASE_SK.map(([n,v])=>({n,v:over[n]??v}));

  return {id,group,name,prof,player,age:'',stats:{FOR,CON,DEX,INT,POU,CHA},pv:{cur:pvMax,max:pvMax},vol:{cur:POU,max:POU},

}

    mk('b3','b','Victor Lassalle','Agent de la DEA','vlass',[12,12,14,12,10,14],{'Persuasion':55,'Renseignement humain':50,'Déguisement':40,'Armes à feu':45},'Ne plus jamais être pris au dépourvu',[{n:'Lucie, ex-femme',s:7}],[{n:'Beretta 92',c:'Armes à feu',d:'1D10',p:'15 m'}],'Faux papiers, téléphone jetable','')
  ];
  const secret={};agents.forEach(a=>{const s=a.stats.POU*5;secret[a.id]={san:s-([4,9,2,0,6,3,11][agents.indexOf(a)]),max:99,seuil:s-a.stats.POU}});
  return {v:1,
    groups:[{id:'a',name:'Cellule ORPHÉE',monde:'Monde Foundry n°1'},{id:'b',name:'Cellule VESPER',monde:'Monde Foundry n°2'}],
    agents,secret,
    next:{a:'2026-12-05T20:30',b:'2026-12-12T21:00'},
    ops:[
      {id:'oa1',group:'a',title:'Opération CENDRES',status:'terminee',when:'Septembre – octobre 2026',
       resume:'Envoyée enquêter sur un incendie de laboratoire universitaire dans l’Ohio, la cellule a découvert que les chercheurs avaient reproduit un protocole retrouvé dans des archives militaires de 1952. Trois disparus, un survivant interné. Les agents ont détruit les notes, maquillé la scène en accident électrique et rapporté un unique échantillon, désormais sous scellés.',

       seances:[{n:1,date:'2026-10-24',cr:'Une équipe de géomètres ne répond plus dans le Montana. Hale mène la reconnaissance ; Okafor examine le seul corps retrouvé, figé dans une posture de prière. Lassalle remonte la piste d’un acheteur de terrains payé en liquide.'}]},
      {id:'ob2',group:'b',title:'Opération CENTRALE',status:'verrouillee',when:'À venir',resume:'',seances:[]}
    ],

      perso:{a1:'Pike tire trop vite. En parler au briefing.\nDemander à Solberg de vérifier les relevés téléphoniques de Lomax.'}},
    pending:[{id:'p1',handle:'nouvelle_recrue',since:'2026-11-24'}]
  };

let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.v!==1)S=seed();
let saveT,toastT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250);
  const t=document.getElementById('toast');t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1100);}

const U={logged:false,role:null,me:null,group:'a',view:'tableau',op:null,agent:null,lb:null,filter:'all'};
const VIEWS=[['tableau','Tableau'],['agents','Agents'],['operations','Opérations'],['notes','Notes'],['aides','Aides de jeu']];

const isMJ=()=>U.role==='mj';
const G=()=>isMJ()?U.group:agentById(U.me).group;
const agentById=id=>S.agents.find(a=>a.id===id);
const groupById=id=>S.groups.find(g=>g.id===id);
const canEdit=a=>isMJ()||a.id===U.me;
const ops=()=>S.ops.filter(o=>o.group===G()&&(isMJ()||o.status!=='verrouillee'));
const aides=()=>S.aides.filter(h=>h.group===G()&&(isMJ()||h.open)&&(isMJ()||S.ops.find(o=>o.id===h.op).status!=='verrouillee'));
const fmtD=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const fmtDT=d=>new Date(d).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const initials=s=>esc(s.replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase());
const SIL='<svg viewBox="0 0 80 100" aria-hidden="true"><rect width="80" height="100" fill="#7d8274"/><circle cx="40" cy="38" r="17" fill="#5d6256"/><path d="M8 100 C10 72 26 62 40 62 S70 72 72 100Z" fill="#5d6256"/></svg>';
const portrait=(a,cls)=>a.portrait?`<img class="${cls||''}" src="${esc(a.portrait)}" alt="Portrait de ${esc(a.name)}">`:(cls?`<span class="${cls}">${SIL}</span>`:SIL);
const statusStamp=s=>s==='terminee'?'<span class="stamp dim">Classée</span>':s==='en_cours'?'<span class="stamp">En cours</span>':'<span class="stamp dim">Verrouillée</span>';

/* ---------- illustrations d'aides de jeu (SVG générés) ---------- */
function aideSvg(h){
  const t=esc(h.title);let body='';
  const lines=(y0,n,w)=>Array.from({length:n},(_,i)=>`<rect x="34" y="${y0+i*16}" width="${w-((i*37)%90)}" height="5" rx="2" fill="#6f6a5c"/>`).join('');
  if(h.kind==='photo'){
    body=`<rect x="20" y="20" width="260" height="190" fill="#2b2d28"/><rect x="20" y="150" width="260" height="60" fill="#1b1c19"/>
      <path d="M60 150 L60 95 L110 70 L160 95 L160 150Z" fill="#45483f"/><rect x="95" y="112" width="26" height="38" fill="#121310"/>
      <rect x="180" y="104" width="70" height="46" fill="#3a3d35"/><circle cx="230" cy="52" r="14" fill="#c9c6b5" opacity=".5"/>
      <rect x="20" y="20" width="260" height="190" fill="url(#gr)" opacity=".35"/>`;
  }else if(h.kind==='carte'){
    body=`<rect x="20" y="20" width="260" height="190" fill="#e6dfc8"/><path d="M20 160 C80 140 110 190 170 170 S250 120 280 140 L280 210 L20 210Z" fill="#9db3b0"/>
      <path d="M40 40 L130 90 L120 150 M130 90 L250 60 M180 74 L200 150" stroke="#8a7a5a" stroke-width="3" fill="none"/>
      <path d="M30 120 L270 100" stroke="#b9ad8d" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="200" cy="150" r="17" fill="none" stroke="#b3261e" stroke-width="3"/><text x="222" y="186" font-family="Courier Prime,monospace" font-size="12" fill="#b3261e">ici ?</text>`;
  }else if(h.kind==='telegramme'){
    body=`<rect x="20" y="20" width="260" height="190" fill="#efe3b8"/><rect x="20" y="20" width="260" height="30" fill="#d8c78c"/>
      <text x="34" y="41" font-family="Special Elite,monospace" font-size="14" fill="#3a3320">WESTERN TELEGRAM</text>
      ${[0,1,2,3].map(i=>`<rect x="34" y="${70+i*26}" width="${200-i*30}" height="14" fill="#fbf6e4"/>`).join('')}
      <text x="38" y="81" font-family="Courier Prime,monospace" font-size="10" fill="#222">RDV BRUNSWICK STOP</text>`;
  }else{
    body=`<rect x="20" y="20" width="260" height="190" fill="#f8f6ef"/>${lines(44,9,220)}
      <rect x="60" y="92" width="120" height="9" fill="#111"/><rect x="34" y="140" width="90" height="9" fill="#111"/>
      <g transform="rotate(-12 200 175)"><rect x="140" y="160" width="124" height="30" fill="none" stroke="#b3261e" stroke-width="3"/>
      <text x="202" y="181" text-anchor="middle" font-family="Special Elite,monospace" font-size="15" fill="#b3261e">CONFIDENTIEL</text></g>`;
  }
  return `<svg viewBox="0 0 300 250" role="img" aria-label="${t}"><defs><pattern id="gr" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#fff"/></pattern></defs>${body}</svg>`;
}

/* ---------- vues ---------- */

  if(U.role==='pending')return `<div class="login"><div class="box"><span class="stamp">Accréditation en attente</span>
    <h1 style="margin:18px 0 10px">Votre compte Discord est reconnu.</h1>
    <p>Le meneur doit encore vous rattacher à une cellule et à un agent. Vous serez prévenu sur le serveur Discord dès que c’est fait.</p>
    <p class="muted sm">Connecté en tant que <b>nouvelle_recrue</b>.</p><button data-act="logout">Retour</button></div></div>`;

    <h1 style="margin:18px 0 8px">Archives des cellules</h1>

    ${step2?`<p class="sm muted" style="margin-top:20px">Maquette : la vraie connexion Discord n’est pas branchée. Choisissez sous quelle identité visiter.</p>
      ${S.groups.map(g=>`<h3 style="margin:16px 0 8px">${esc(g.name)}</h3><div class="who">${S.agents.filter(a=>a.group===g.id).map(a=>`<button data-act="as" data-id="${a.id}"><span class="av">${initials(a.player)}</span><span><b>${esc(a.player)}</b><br><span class="sm muted">${esc(a.name)}</span></span></button>`).join('')}</div>`).join('')}
      <h3 style="margin:16px 0 8px">Autres</h3><div class="who"><button data-act="as" data-id="mj"><span class="av" style="background:#b3261e">MJ</span><b>Meneur de jeu</b></button><button data-act="as" data-id="pending"><span class="av" style="background:#777">?</span><span><b>Compte non accrédité</b></span></button></div>`
    :`<div style="margin-top:22px"><button class="discord" data-act="discord"><svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path fill="#fff" d="M18.6 1.3A18 18 0 0 0 14.1 0l-.6 1.2a16.7 16.7 0 0 0-5 0L7.9 0a18 18 0 0 0-4.5 1.3C.6 5.6-.2 9.8.2 13.9A18 18 0 0 0 5.7 16l1.1-1.8c-.6-.2-1.2-.5-1.8-.9l.4-.3a12.8 12.8 0 0 0 11.2 0l.4.3c-.6.4-1.2.7-1.8.9l1.1 1.8a18 18 0 0 0 5.5-2.1c.5-4.8-.8-8.9-3.2-12.6ZM7.4 11.4c-1.1 0-2-1-2-2.2S6.3 7 7.4 7s2 1 2 2.2-.9 2.2-2 2.2Zm7.2 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>Se connecter avec Discord</button></div>`}
    <p class="sm muted" style="margin-top:22px">Maquette, données fictives.</p></div></div>`;
}
function header(){
  const who=isMJ()?{h:'Meneur de jeu',n:'Accès complet'}:{h:agentById(U.me).player,n:agentById(U.me).name};
  const g=groupById(G());
  return `<header class="top"><div class="brand">Archives des cellules<small>${isMJ()?'':esc(g.name)}</small></div>
   ${isMJ()?`<label class="chip" style="margin:0">Cellule <select data-in="group" aria-label="Cellule affichée">${S.groups.map(x=>`<option value="${x.id}"${x.id===U.group?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:''}
   <span class="chip"><span class="av"${isMJ()?' style="background:#b3261e"':''}>${isMJ()?'MJ':initials(who.h)}</span><span>${esc(who.h)}<br><span style="opacity:.7;font-size:13px">${esc(who.n)}</span></span></span>
   <button class="small" data-act="logout">Changer d’identité</button></header>`;
}
function tabs(){
  const v=[...VIEWS];if(isMJ())v.push(['mj','Espace MJ']);
  return `<nav class="tabs" aria-label="Sections">${v.map(([k,l])=>`<a href="#${k}"${k==='mj'?' class="mj"':''}${U.view===k?' aria-current="page"':''}>${l}</a>`).join('')}</nav>`;
}
function tableau(){
  const cur=ops().find(o=>o.status==='en_cours');const last=cur&&cur.seances[cur.seances.length-1];
  const me=!isMJ()&&agentById(U.me);
  const ag=S.agents.filter(a=>a.group===G());
  const recent=aides().filter(h=>h.open).slice(-3).reverse();
  return `<div class="hd"><h1>${esc(groupById(G()).name)}</h1><span class="muted sm">${esc(groupById(G()).monde)}</span></div>
  <div class="grid g2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
   <div class="box tint">${cur?`<div class="hd"><h2>${esc(cur.title)}</h2>${statusStamp(cur.status)}</div>
     ${last?`<p class="sm muted">Dernière séance : n°${last.n}, ${fmtD(last.date)}</p><p>${esc(last.cr)}</p>`:'<p class="muted">Aucune séance pour l’instant.</p>'}
     <button data-act="openop" data-id="${cur.id}">Lire tout le dossier</button>`:'<div class="empty">Aucune opération en cours.</div>'}</div>
   <div class="grid" style="align-content:start">
    <div class="box"><h3>Prochaine séance</h3>
     ${isMJ()?`<input type="datetime-local" data-in="next" value="${esc(S.next[G()])}" aria-label="Date de la prochaine séance" style="margin-top:8px">`:`<p class="val" style="font-size:19px;margin:.4em 0 0">${S.next[G()]?esc(fmtDT(S.next[G()])):'À fixer'}</p>`}</div>
    ${me?`<div class="box"><div class="hd" style="margin-bottom:8px"><span class="row">${portrait(me,'pt')}<h3>${esc(me.name)}</h3></span><a href="#agents" class="sm">Ma fiche</a></div>${vit(me)}</div>`
     :`<div class="box"><h3 style="margin-bottom:8px">Agents</h3><ul class="list">${ag.map(a=>`<li style="padding:8px 0"><span class="row">${portrait(a,'pt')}<span><b>${esc(a.name)}</b> <span class="sm muted">${esc(a.player)}</span></span></span>${vit(a)}</li>`).join('')}</ul></div>`}
   </div></div>
  <div class="sec"><h3>Dernières pièces versées au dossier</h3>${recent.length?`<div class="ev">${recent.map(h=>card(h)).join('')}</div>`:'<div class="empty">Aucune pour l’instant.</div>'}</div>`;
}
function vit(a){
  const m=(l,c,x,bad)=>`<div class="sm" style="margin-top:6px">${l} <span class="val">${c}/${x}</span><div class="meter${bad?' bad':''}"><i style="width:${Math.max(0,Math.min(100,c/x*100))}%"></i></div></div>`;
  const s=S.secret[a.id];
  return m('PV',a.pv.cur,a.pv.max,a.pv.cur<=2)+m('VOL',a.vol.cur,a.vol.max,a.vol.cur<=2)+(isMJ()?m('SAN',s.san,s.max,s.san<=s.seuil)+`<div class="sm muted">Seuil de rupture : <span class="val">${s.seuil}</span></div>`:'');
}
function inp(a,path,val,type,extra){const dis=canEdit(a)?'':' disabled';return `<input${type==='n'?' type="number" inputmode="numeric"':''} data-a="${a.id}" data-f="${path}" value="${esc(val)}"${dis}${extra||''}>`}
function agents(){
  const list=S.agents.filter(a=>a.group===G());
  if(!U.agent||!list.some(a=>a.id===U.agent))U.agent=isMJ()?list[0].id:U.me;
  const a=agentById(U.agent),ed=canEdit(a),s=S.secret[a.id];
  const ta=(path,val,lbl)=>`<div><label for="f-${path}">${lbl}</label><textarea id="f-${path}" data-a="${a.id}" data-f="${path}"${ed?'':' disabled'}>${esc(val)}</textarea></div>`;
  return `<div class="grid side">
  <div><h2 style="margin-bottom:10px">Agents</h2><ul class="list">${list.map(x=>`<li><button class="pick" data-act="agent" data-id="${x.id}"${x.id===a.id?' aria-current="true"':''}>${portrait(x,'pt')}<span><b>${esc(x.name)}</b><span class="sm muted">${esc(x.player)}${x.id===U.me?' · vous':''}</span></span></button></li>`).join('')}</ul></div>
  <article>
   <div class="idcard"><div><div class="portrait">${portrait(a)}</div>
     ${ed?`<div class="pbtns"><label class="btn small" for="pf-${a.id}">${a.portrait?'Changer la photo':'Ajouter une photo'}</label><input class="vis" type="file" accept="image/*" id="pf-${a.id}" data-portrait="${a.id}">${a.portrait?`<button class="small" data-act="delportrait" data-id="${a.id}">Retirer</button>`:''}</div>`:''}</div>
    <div><div class="hd"><div><h1>${esc(a.name)}</h1><p class="muted" style="margin:.3em 0 0">${esc(a.prof)} · joué par ${esc(a.player)}</p></div>
    ${ed?(isMJ()?'<span class="stamp">Édition MJ</span>':'<span class="stamp ok">Votre dossier</span>'):'<span class="stamp dim">Lecture seule</span>'}</div>
   <div class="grid g2" style="margin-bottom:8px"><div><label>Nom de l’agent</label>${inp(a,'name',a.name)}</div><div><label>Profession</label>${inp(a,'prof',a.prof)}</div></div></div></div>
   <div class="sec"><h3>Caractéristiques</h3><div class="stats">${Object.entries(a.stats).map(([k,v])=>`<div class="stat"><label>${k}</label>${inp(a,'stats.'+k,v,'n',` aria-label="${k}"`)}<div class="x5" id="x5-${k}">×5 = ${v*5}</div></div>`).join('')}</div></div>
   <div class="sec"><h3>Attributs dérivés</h3><div class="derived">
    <div><label>Points de vie</label><div class="pair">${inp(a,'pv.cur',a.pv.cur,'n',' aria-label="PV actuels"')}<span>/</span>${inp(a,'pv.max',a.pv.max,'n',' aria-label="PV max"')}</div></div>
    <div><label>Volonté</label><div class="pair">${inp(a,'vol.cur',a.vol.cur,'n',' aria-label="VOL actuelle"')}<span>/</span>${inp(a,'vol.max',a.vol.max,'n',' aria-label="VOL max"')}</div></div>
    <div><label>Santé mentale</label>${isMJ()?`<div class="pair"><input type="number" data-secret="${a.id}" data-f="san" value="${s.san}" aria-label="SAN"><span>/</span><input type="number" data-secret="${a.id}" data-f="max" value="${s.max}" aria-label="SAN max"></div>`:'<span class="redact">CLASSIFIÉ</span>'}</div>
    <div><label>Seuil de rupture</label>${isMJ()?`<input type="number" data-secret="${a.id}" data-f="seuil" value="${s.seuil}" aria-label="Seuil de rupture">`:'<span class="redact">CLASSIFIÉ</span>'}</div>
   </div>${isMJ()?'':'<p class="sm muted" style="margin:10px 0 0">La santé mentale et le seuil de rupture sont tenus par le meneur.</p>'}</div>
   <div class="sec grid g2">${ta('motiv',a.motiv,'Motivations et troubles mentaux')}
    <div><label>Liens</label>${a.liens.map((l,i)=>`<div class="sk${ed?'':' ro'}">${inp(a,`liens.${i}.n`,l.n,'',' aria-label="Lien"')}${inp(a,`liens.${i}.s`,l.s,'n',' aria-label="Score"')}${ed?`<button class="x" data-act="del" data-a="${a.id}" data-k="liens" data-i="${i}" aria-label="Supprimer">×</button>`:''}</div>`).join('')}
     ${ed?'<button class="small" data-act="add" data-k="liens" style="margin-top:8px">+ Lien</button>':''}
     <div style="margin-top:14px" class="sm"><div class="checks">Adapté à la violence ${a.violence.map((c,i)=>`<input type="checkbox" data-a="${a.id}" data-f="violence.${i}"${c?' checked':''}${ed?'':' disabled'} aria-label="Violence ${i+1}">`).join('')}</div>
     <div class="checks" style="margin-top:6px">Adapté à l’impuissance ${a.impuiss.map((c,i)=>`<input type="checkbox" data-a="${a.id}" data-f="impuiss.${i}"${c?' checked':''}${ed?'':' disabled'} aria-label="Impuissance ${i+1}">`).join('')}</div></div></div></div>
   <div class="sec"><h3>Compétences</h3><div class="skills">${a.comps.map((c,i)=>`<div class="sk${ed?'':' ro'}">${inp(a,`comps.${i}.n`,c.n,'',' aria-label="Compétence"')}${inp(a,`comps.${i}.v`,c.v,'n',' aria-label="Pourcentage"')}${ed?`<button class="x" data-act="del" data-a="${a.id}" data-k="comps" data-i="${i}" aria-label="Supprimer">×</button>`:''}</div>`).join('')}</div>
    ${ed?'<button class="small" data-act="add" data-k="comps" style="margin-top:10px">+ Compétence</button>':''}</div>
   <div class="sec"><h3>Armes</h3>${a.armes.length?`<div class="weap${ed?'':' ro'} sm muted"><span>Arme</span><span>Compétence</span><span>Dégâts</span><span>Portée</span></div>`:''}
    ${a.armes.map((w,i)=>`<div class="weap${ed?'':' ro'}">${inp(a,`armes.${i}.n`,w.n,'',' aria-label="Arme"')}${inp(a,`armes.${i}.c`,w.c,'',' aria-label="Compétence"')}${inp(a,`armes.${i}.d`,w.d,'',' aria-label="Dégâts"')}${inp(a,`armes.${i}.p`,w.p,'',' aria-label="Portée"')}${ed?`<button class="x" data-act="del" data-a="${a.id}" data-k="armes" data-i="${i}" aria-label="Supprimer">×</button>`:''}</div>`).join('')||'<p class="muted sm">Aucune arme.</p>'}
    ${ed?'<button class="small" data-act="add" data-k="armes" style="margin-top:6px">+ Arme</button>':''}</div>
   <div class="sec grid g2">${ta('equip',a.equip,'Équipement')}${ta('bless',a.bless,'Blessures et séquelles')}</div>
  </article></div>`;
}
function operations(){
  const list=ops();
  if(!U.op||!list.some(o=>o.id===U.op))U.op=(list.find(o=>o.status==='en_cours')||list[0]||{}).id;
  const o=list.find(x=>x.id===U.op);
  return `<div class="grid side"><div><h2 style="margin-bottom:12px">Opérations</h2><div class="tl">${list.map(x=>`<div class="op${x.status==='en_cours'?' cur':''}${x.status==='verrouillee'?' locked':''}"><button data-act="op" data-id="${x.id}"${x.id===U.op?' aria-current="true"':''}><span class="typed" style="font-size:17px">${esc(x.title)}</span><br><span class="sm muted">${esc(x.when)}</span></button></div>`).join('')}</div></div>
  <article>${o?`<div class="hd"><h1>${esc(o.title)}</h1>${statusStamp(o.status)}</div>
   ${o.status==='verrouillee'?'<div class="empty">Opération invisible pour les joueurs. Débloquez-la depuis l’espace MJ quand elle commence.</div>':''}
   ${o.resume?`<div class="box tint"><h3 style="margin-bottom:6px">Résumé de l’opération</h3><p style="margin:0">${esc(o.resume)}</p></div>`:''}
   ${o.seances.length?`<h3 style="margin-top:24px">Comptes rendus de séance</h3>${o.seances.slice().reverse().map(s=>`<div class="cr"><div class="typed">Séance ${s.n}</div><div class="sm muted">${fmtD(s.date)}</div><p>${esc(s.cr)}</p></div>`).join('')}`:''}
   ${o.status!=='verrouillee'?`<h3 style="margin-top:24px">Pièces liées</h3>${(()=>{const h=aides().filter(x=>x.op===o.id);return h.length?`<div class="ev">${h.map(card).join('')}</div>`:'<p class="muted">Aucune.</p>'})()}`:''}`
   :'<div class="empty">Aucune opération.</div>'}</article></div>`;
}
function notes(){
  const c=S.notes.commune[G()]||{t:'',by:'',at:''};
  return `<div class="hd"><h1>Notes</h1></div><div class="grid g2">
   <div class="box tint"><h2 style="margin-bottom:4px">Note de la cellule</h2><p class="sm muted" id="cby">${c.by?`Dernière modification : ${esc(c.by)}, ${esc(fmtDT(c.at))}`:'Vide pour l’instant.'}</p>
    <textarea data-note="commune" style="min-height:340px" aria-label="Note commune">${esc(c.t)}</textarea><p class="sm muted">Visible et modifiable par toute la cellule et le meneur.</p></div>
   ${isMJ()?`<div class="box"><h2 style="margin-bottom:4px">Notes personnelles</h2><p>Chaque joueur dispose d’une note privée, visible de lui seul sur le site.</p><p class="sm muted">Dans la version finale, elles restent lisibles par toi uniquement depuis l’administration Supabase, pas depuis cette page.</p></div>`
   :`<div class="box"><h2 style="margin-bottom:4px">Mon carnet</h2><p class="sm muted">Privé : personne d’autre ne le voit sur le site.</p>
    <textarea data-note="perso" style="min-height:340px" aria-label="Note personnelle">${esc(S.notes.perso[U.me]||'')}</textarea></div>`}</div>`;
}
function card(h){
  const r=((h.id.charCodeAt(1)*7)%5-2)*.8;const op=S.ops.find(o=>o.id===h.op);
  return `<button class="card${h.open?'':' lock'}" data-act="lb" data-id="${h.id}" style="--r:${r}deg"><div class="ph">${aideSvg(h)}</div><div class="cap"><b>${esc(h.title)}</b><br><span class="muted">${esc(op.title)}${h.open?'':' · non visible des joueurs'}</span></div></button>`;
}
function aidesView(){
  const all=aides();const opsWith=[...new Set(all.map(h=>h.op))];
  const list=all.filter(h=>U.filter==='all'||h.op===U.filter);
  return `<div class="hd"><h1>Aides de jeu</h1><span class="muted sm">${all.length} pièce${all.length>1?'s':''}</span></div>
  <div class="row" style="margin-bottom:22px"><button class="small${U.filter==='all'?' primary':''}" data-act="filter" data-id="all">Toutes</button>${opsWith.map(id=>`<button class="small${U.filter===id?' primary':''}" data-act="filter" data-id="${id}">${esc(S.ops.find(o=>o.id===id).title)}</button>`).join('')}</div>
  ${list.length?`<div class="ev">${list.map(card).join('')}</div>`:'<div class="empty">Aucune aide de jeu pour l’instant.</div>'}`;
}
function mj(){
  const g=G(),gOps=S.ops.filter(o=>o.group===g),gAides=S.aides.filter(h=>h.group===g),ag=S.agents.filter(a=>a.group===g);
  return `<div class="hd"><h1>Espace MJ</h1><span class="muted sm">${esc(groupById(g).name)}</span></div>
  <div class="grid g2">
   <div class="box"><h2 style="margin-bottom:10px">Accréditations</h2>${S.pending.length?S.pending.map(p=>`<div style="margin-bottom:14px"><p style="margin:0 0 6px"><b>${esc(p.handle)}</b> <span class="sm muted">connecté le ${fmtD(p.since)}</span></p>
     <div class="row"><select data-pend="${p.id}" aria-label="Rattacher à" style="flex:1 1 200px">${S.agents.map(a=>`<option value="${a.id}">${esc(groupById(a.group).name)} · ${esc(a.name)}</option>`).join('')}</select><button class="small primary" data-act="accr" data-id="${p.id}">Accréditer</button><button class="small" data-act="refuse" data-id="${p.id}">Refuser</button></div></div>`).join(''):'<p class="muted">Aucune demande en attente.</p>'}
    <p class="sm muted">Chaque compte Discord qui se connecte arrive ici. Rien n’est visible pour lui tant que tu ne l’as pas rattaché.</p></div>
   <div class="box"><h2 style="margin-bottom:10px">Santé mentale</h2><table class="stack"><thead><tr><th>Agent</th><th>SAN</th><th>Seuil</th></tr></thead><tbody>${ag.map(a=>{const s=S.secret[a.id];return `<tr><td>${esc(a.name)}</td><td class="n"><input type="number" data-secret="${a.id}" data-f="san" value="${s.san}" style="width:80px" aria-label="SAN de ${esc(a.name)}"></td><td class="n"><input type="number" data-secret="${a.id}" data-f="seuil" value="${s.seuil}" style="width:80px" aria-label="Seuil de ${esc(a.name)}"></td></tr>`}).join('')}</tbody></table>
    <p class="sm muted">Jamais envoyé aux navigateurs des joueurs.</p></div>
  </div>
  <div class="box sec"><h2 style="margin-bottom:10px">Publier un compte rendu</h2>
   <div class="grid g3"><div><label for="cr-op">Opération</label><select id="cr-op">${gOps.filter(o=>o.status!=='terminee').map(o=>`<option value="${o.id}">${esc(o.title)}</option>`).join('')}</select></div>
    <div><label for="cr-d">Date de la séance</label><input type="date" id="cr-d" value="2026-11-25"></div><div style="align-self:end"><button class="primary" data-act="pubcr">Publier</button></div></div>
   <label for="cr-t" style="margin-top:12px">Texte (je pourrai le rédiger à partir de tes notes brutes)</label><textarea id="cr-t" placeholder="Ce qui s’est passé pendant la séance…"></textarea></div>
  <div class="grid g2 sec">
   <div class="box"><h2 style="margin-bottom:10px">Opérations</h2><ul class="list">${gOps.map(o=>`<li class="row" style="padding:8px 0;justify-content:space-between"><span><b>${esc(o.title)}</b><br>${statusStamp(o.status)}</span>
     <select data-opst="${o.id}" style="width:auto" aria-label="Statut de ${esc(o.title)}">${[['verrouillee','Verrouillée'],['en_cours','En cours'],['terminee','Classée']].map(([k,l])=>`<option value="${k}"${o.status===k?' selected':''}>${l}</option>`).join('')}</select></li>`).join('')}</ul></div>
   <div class="box"><h2 style="margin-bottom:10px">Aides de jeu</h2><ul class="list">${gAides.map(h=>`<li class="row" style="padding:8px 0;justify-content:space-between"><span><b>${esc(h.title)}</b><br><span class="sm muted">${esc(S.ops.find(o=>o.id===h.op).title)}</span></span>
     <button class="small${h.open?'':' primary'}" data-act="toggleaide" data-id="${h.id}">${h.open?'Masquer':'Montrer aux joueurs'}</button></li>`).join('')}</ul>
    <button class="small" disabled style="margin-top:10px;opacity:.5">+ Téléverser une image (version finale)</button></div>
  </div>
  <div class="box tint sec"><h2 style="margin-bottom:6px">Synchronisation Foundry</h2><p style="margin:0">Dans la version finale : un import des fiches depuis ${esc(groupById(g).monde)}, préparé par Claude quand Foundry est allumé, et un export des modifications faites ici par les joueurs.</p></div>`;
}
function lightbox(){
  if(!U.lb)return '';const list=aides().filter(h=>U.view!=='aides'||U.filter==='all'||h.op===U.filter);
  const i=list.findIndex(h=>h.id===U.lb);if(i<0)return '';const h=list[i];
  return `<div class="lb" role="dialog" aria-modal="true" aria-label="${esc(h.title)}"><div class="bar"><span class="typed" style="font-size:19px">${esc(h.title)}</span><button data-act="lbclose" aria-label="Fermer">Fermer</button></div>
   <div class="img">${aideSvg(h)}</div><div class="bar"><button data-act="lbgo" data-id="${list[(i-1+list.length)%list.length].id}">← Précédente</button><span class="sm">${i+1} / ${list.length}</span><button data-act="lbgo" data-id="${list[(i+1)%list.length].id}">Suivante →</button></div></div>`;
}
function render(){
  if(!U.logged){app.innerHTML=loginView();return}
  const v={tableau,agents,operations,notes,aides:aidesView,mj}[U.view]||tableau;
  app.innerHTML=header()+tabs()+`<main class="sheet">${v()}</main><p class="foot">Maquette, données fictives. Vos modifications restent dans ce navigateur.</p>`+lightbox();
}

/* ---------- interactions ---------- */
function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v}
function route(){const h=location.hash.slice(1);const ok=VIEWS.some(v=>v[0]===h)||(h==='mj'&&isMJ());U.view=ok?h:'tableau';U.lb=null;if(U.logged)render()}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const id=t.dataset.id;
  switch(t.dataset.act){
    case 'discord':U.role='choose';break;
    case 'as':if(id==='pending'){U.role='pending';break}U.logged=true;U.role=id==='mj'?'mj':'joueur';U.me=id==='mj'?null:id;U.agent=null;U.op=null;U.filter='all';
      if(U.view==='mj'&&!isMJ())U.view='tableau';break;
    case 'logout':U.logged=false;U.role=null;break;
    case 'agent':U.agent=id;break;
    case 'op':U.op=id;break;
    case 'openop':U.op=id;location.hash='operations';return;
    case 'filter':U.filter=id;break;
    case 'lb':case 'lbgo':U.lb=id;break;
    case 'lbclose':U.lb=null;break;
    case 'add':{const a=agentById(U.agent);const k=t.dataset.k;a[k].push(k==='liens'?{n:'',s:0}:k==='comps'?{n:'',v:0}:{n:'',c:'',d:'',p:''});save();break}
    case 'del':{agentById(t.dataset.a)[t.dataset.k].splice(+t.dataset.i,1);save();break}
    case 'delportrait':agentById(id).portrait='';save();break;
    case 'toggleaide':{const h=S.aides.find(x=>x.id===id);h.open=!h.open;save();break}
    case 'accr':{const sel=document.querySelector(`[data-pend="${id}"]`);const p=S.pending.find(x=>x.id===id);const a=agentById(sel.value);a.player=p.handle;S.pending=S.pending.filter(x=>x.id!==id);save();break}
    case 'refuse':S.pending=S.pending.filter(x=>x.id!==id);save();break;
    case 'pubcr':{const o=S.ops.find(x=>x.id===document.getElementById('cr-op').value);const txt=document.getElementById('cr-t').value.trim();const d=document.getElementById('cr-d').value;
      if(!o||!txt){document.getElementById('cr-t').focus();return}
      o.seances.push({n:o.seances.length+1,date:d||'2026-11-25',cr:txt});if(o.status==='verrouillee')o.status='en_cours';save();U.op=o.id;location.hash='operations';return}
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.a&&t.dataset.f){
    const a=agentById(t.dataset.a);if(!canEdit(a))return;
    const v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?0:+t.value):t.value;
    setPath(a,t.dataset.f,v);
    if(t.dataset.f.startsWith('stats.')){const el=document.getElementById('x5-'+t.dataset.f.slice(6));if(el)el.textContent='×5 = '+(v*5)}
    save();
  }else if(t.dataset.secret&&isMJ()){S.secret[t.dataset.secret][t.dataset.f]=+t.value||0;save()}
  else if(t.dataset.note==='commune'){S.notes.commune[G()]={t:t.value,by:isMJ()?'MJ':agentById(U.me).player,at:new Date().toISOString()};
    const c=document.getElementById('cby');if(c)c.textContent='Dernière modification : vous, à l’instant';save()}
  else if(t.dataset.note==='perso'){S.notes.perso[U.me]=t.value;save()}
});
function loadPortrait(a,file){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const W=360,H=450,c=document.createElement('canvas');c.width=W;c.height=H;
    const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;
    c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);
    a.portrait=c.toDataURL('image/jpeg',.82);save();render()};
  img.onerror=()=>URL.revokeObjectURL(url);img.src=url;
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.portrait){const a=agentById(t.dataset.portrait);if(canEdit(a)&&t.files[0])loadPortrait(a,t.files[0]);return}
  if(t.dataset.in==='group'){U.group=t.value;U.agent=null;U.op=null;U.filter='all';render()}
  else if(t.dataset.in==='next'){S.next[G()]=t.value;save()}
  else if(t.dataset.opst){S.ops.find(o=>o.id===t.dataset.opst).status=t.value;save();render()}
});
document.addEventListener('keydown',e=>{
  if(!U.lb)return;
  if(e.key==='Escape'){U.lb=null;render()}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const b=[...document.querySelectorAll('[data-act="lbgo"]')];const btn=e.key==='ArrowRight'?b[1]:b[0];if(btn){U.lb=btn.dataset.id;render()}}
});
route();render();
}
</script>
</body>
</html>
